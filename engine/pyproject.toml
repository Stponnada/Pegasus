[project]
name = "ontomem"
version = "0.0.1"
description = "Ontology-based long-term memory engine for LLMs (Phase 1)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["google-genai>=1.0"]
local = ["fastembed>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontomem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not integration'"
markers = ["integration: hits the live LLM; requires GEMINI_API_KEY"]
